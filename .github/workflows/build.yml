name: build-sjz
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run collector tests
        run: bash tests/run_sjz_tests.sh
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build and package SJZ app
        run: bash scripts/build_sjz.sh --package
      - name: Upload unsigned app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sjz-overlay-unsigned-app
          path: build/DerivedDataSJZ/Build/Products/Release-iphoneos/SJZ Overlay.app/
          if-no-files-found: error
      - name: Upload ad-hoc IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sjz-overlay-adhoc-ipa
          path: |
            build/SJZ-Overlay-*.ipa
            build/SJZ-Overlay-*.ipa.sha256
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sjz-build-log
          path: build/xcodebuild-sjz.log
          if-no-files-found: warn
